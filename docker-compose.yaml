services:
  postgres:
    image: 'postgres:16.3-alpine'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: picpay_simplified

  mockoon:
    hostname: mockoon
    image: mockoon/cli:8.3.0
    command: [ "--data" , "data", "--port", "9090" , "--log-transaction"]
    volumes:
      - ./src/test/resources/mocks.json:/data
    ports:
      - "9090:9090"

  kafka:
    hostname: kafka
    image: blacktop/kafka:3.3.1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true