[versions]
kotlin = "2.0.10"
kotlin-logging-jvm = "7.0.0"
ktlint = "12.1.1"
spring = "3.3.2"
spring-dependency-management = "1.1.6"
ulidj = "1.0.4"
kotest = "5.9.1"
apache-commons = "3.15.0"
spring-mockk = "4.0.0"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
kotlin-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging-jvm" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

kotest-junit = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }

spring-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-mockk = { module = "com.ninja-squad:springmockk", version.ref = "spring-mockk" }

jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

micrometer-tracing-brave = { module = "io.micrometer:micrometer-tracing-bridge-brave" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

reactor-kotlin-extensions = { module = "io.projectreactor.kotlin:reactor-kotlin-extensions" }
reactor-test = { module = "io.projectreactor:reactor-test" }

flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql" }

postgres-driver-r2dbc = { module = "org.postgresql:r2dbc-postgresql" }
postgres-driver-jdbc = { module = "org.postgresql:postgresql" }

ulidj = { module = "io.azam.ulidj:ulidj", version.ref = "ulidj" }

testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }

apache-commons = { module = "org.apache.commons:commons-lang3", version.ref = "apache-commons" }

junit-plataform = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }