spring:
  application:
    name: picpay-backend-challenge
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST}:5432/picpay_simplified
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/picpay_simplified
  kafka:
    client-id: ${spring.application.name}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      retries: 3
    security:
      protocol: SSL
    ssl:
      key-store-location: file:${KAFKA_KEYSTORE_LOCATION}
      key-password: ${KAFKA_KEYSTORE_PASSWORD}

picpay-backend-challenge:
  transfer:
    authorization:
      host: ${TRANSFER_AUTHORIZATION_HOST}
      path: /api/v1/transfers/authorization
    notification:
      kafka:
        topic: picpay.traffic.transfer.notification

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: [ "health", "loggers", "metrics", "prometheus" ]